name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'gradle'

    - run: chmod +x gradlew

    - env:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
      run: |
        ./gradlew assembleDebug > build_log.txt 2>&1

    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-build-log-output
        path: build_log.txt
