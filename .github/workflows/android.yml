name: CodeAssist CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'zulu'
        cache: gradle

    # Thêm bước này để ép máy ảo cài đặt đúng SDK phù hợp với AGP 7.0.3
    - name: Setup Android SDK Target
      uses: android-actions/setup-android@v3
      with:
        api-level: 32
        build-tools: 30.0.2
        cmdline-tools: 7.0

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace -x test